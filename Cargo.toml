[package]
name = "amn"
version = "0.1.7"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
strum = { version = "0.27", features = ["derive"] }
uuid = { version = "1.26", features = ["v4"] }
